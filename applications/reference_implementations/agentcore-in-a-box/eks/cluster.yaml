apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: agentcore-demo-eks
  region: us-west-2
  version: "1.31"
# The account is at its Elastic-IP quota (5/5), and a NAT gateway would need another EIP. Our nodes
# are PUBLIC (privateNetworking: false), so they route egress via the Internet Gateway and need no
# NAT at all — disable it to avoid the EIP allocation that failed the first create attempt.
vpc:
  nat:
    gateway: Disable
managedNodeGroups:
  - name: ng-default
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: false
