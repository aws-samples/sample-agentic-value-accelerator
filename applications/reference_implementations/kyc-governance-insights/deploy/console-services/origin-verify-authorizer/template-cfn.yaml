AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KYC Origin-Verify Authorizer (Phase 2 of API consolidation). Shared HTTP-API REQUEST
  Lambda authorizer that gates the KYC-exclusive backends to CloudFront-only: CF injects a
  secret x-origin-verify header (edge-only), this authorizer allows only matching requests.
  The secret is created + held in AWS Secrets Manager (encrypted at rest, rotatable); the
  authorizer reads it at runtime with a short in-memory cache. No secret in the template,
  env vars, git, or the browser. phase2-attach.sh wires the authorizer to each backend's
  routes; phase2-deploy.sh injects the Secrets Manager value into CloudFront.
  See docs/DESIGN_DECISION_API_CONSOLIDATION.md.

Parameters:
  ProjectTag:
    Type: String
    Default: kyc-governance-insights
    Description: Project tag for cost attribution.
  EnvironmentTag:
    Type: String
    Default: demo
    AllowedValues: [demo, test, prod]
    Description: Environment tag.

Resources:
  # Secret is generated by CloudFormation — no human ever handles it, nothing is committed.
  # Encrypted at rest with the Secrets Manager default KMS key (SECURITY.md: encryption at rest).
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: kyc/origin-verify
      Description: Shared secret CloudFront injects as x-origin-verify to reach the KYC backends.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true   # keep the value safe as a raw HTTP header value

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kyc-origin-verify-authorizer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Least privilege: read ONLY this one secret.
        - PolicyName: read-origin-verify-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OriginVerifySecret

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/kyc-origin-verify-authorizer
      RetentionInDays: 30

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthorizerLogGroup
    Properties:
      FunctionName: kyc-origin-verify-authorizer
      Runtime: python3.12
      Handler: index.handler
      Timeout: 5
      MemorySize: 128
      ReservedConcurrentExecutions: 10
      Role: !GetAtt AuthorizerRole.Arn
      Environment:
        Variables:
          SECRET_ID: !Ref OriginVerifySecret   # ARN, not the secret value
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
        - {Key: Environment, Value: !Ref EnvironmentTag}
        - {Key: Component, Value: authorizer}
        - {Key: ManagedBy, Value: cloudformation}
      Code:
        ZipFile: |
          import hmac, os, time, boto3
          # HTTP API REQUEST authorizer, payload format 2.0, simple response.
          # With identitySource $request.header.x-origin-verify, API Gateway short-circuits a
          # MISSING header to 401 without invoking this function. A present-but-wrong header
          # reaches here and returns isAuthorized:false -> 403.
          # The secret is read from Secrets Manager at runtime and cached in-memory (TTL), so
          # rotating the secret propagates within TTL without a code change. Never in an env var.
          _sm = boto3.client("secretsmanager")
          SECRET_ID = os.environ["SECRET_ID"]
          TTL = 300
          _cache = {"v": None, "exp": 0.0}

          def _secret():
              now = time.time()
              if _cache["v"] is None or now >= _cache["exp"]:
                  _cache["v"] = _sm.get_secret_value(SecretId=SECRET_ID).get("SecretString", "")
                  _cache["exp"] = now + TTL
              return _cache["v"]

          def handler(event, context):
              hdrs = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
              got = hdrs.get("x-origin-verify", "")
              expected = _secret()
              ok = bool(expected) and hmac.compare_digest(str(got), str(expected))
              return {"isAuthorized": ok}

Outputs:
  AuthorizerFunctionArn:
    Description: ARN of the shared authorizer Lambda; imported by each backend template (Fn::ImportValue kyc-origin-verify-authorizer-arn) to wire the REQUEST authorizer in IaC.
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: kyc-origin-verify-authorizer-arn
  AuthorizerFunctionName:
    Value: !Ref AuthorizerFunction
  OriginSecretArn:
    Description: Secrets Manager ARN holding the x-origin-verify value; phase2-deploy.sh reads it to inject into CloudFront.
    Value: !Ref OriginVerifySecret
