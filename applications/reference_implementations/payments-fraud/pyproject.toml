[project]
name = "payments-fraud"
version = "1.0.0"
description = "Payments fraud scoring & investigation — supervisor agent delegating to Transaction Scorer, Investigation, and SAR Report specialists"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0,<3.0",
    "bedrock-agentcore>=1.9.0,<2.0",
]

[project.optional-dependencies]
strands = ["strands-agents>=1.38.0,<2.0"]
test = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["setuptools>=77.0"]  # >=77 for SPDX license expression support
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
