[pytest]
# Without this file, `cd backend && pytest` - the command the README documented - did not
# run zero tests, it crashed. Two separate causes, both invisible from the command itself:
#
#   1. No `testpaths`, so pytest recursed from the CWD. In the container that CWD is /app,
#      which the Dockerfile also fills with applications/fsi_foundry, aaas/ and
#      reference_implementations/. Collection walked into
#      applications/fsi_foundry/foundations/src/adapters/__init__.py, hit
#      `ModuleNotFoundError: No module named 'bedrock_agentcore'` (a runtime dep that is
#      deliberately not installed here), and pytest exited with INTERNALERROR and
#      "no tests ran". Measured, not assumed.
#   2. No `pythonpath`, so `from services import ...` / `from core.config import settings`
#      could not resolve - the backend's code is under src/ but imports itself as a top-level
#      package. Every invocation needed PYTHONPATH=src prepended by hand, which is why the
#      only working command lived in a CLAUDE.md note instead of in the repo.
#
# `pythonpath` requires pytest >= 7.0; this repo pins 7.4.4 (verified in the backend image).
testpaths = tests
pythonpath = src

# A collection error normally aborts the ENTIRE run ("Interrupted: 4 errors during
# collection"), so the four stale modules below took the other ~370 tests down with them and
# `pytest` reported nothing at all. This reports them as errors and still runs everything
# else, which is what makes keeping them un-ignored viable: the suite stays usable AND the
# breakage stays on screen. Exit status is still non-zero while they are broken.
addopts = --continue-on-collection-errors

# KNOWN BREAKAGE, deliberately NOT hidden with --ignore.
#
# Measured on this branch, against a backend image built AFTER the schemas/ COPY fix below:
# 409 passed, 1 skipped, 25 failed, 4 errors. Every failure and every error is confined to the
# eight modules named below, all of which cover the TEMPLATE subsystem, none of which is
# Govern. (Before that fix it read 368 passed / 10 failed / 34 errors — 383 passed on the same
# commit, then 397 once test_govern_partial_read_honesty.py added 14 and 409 once
# test_region_resolution_report.py added 12. At 368 the schema was missing,
# so test_bootstrap_engine and test_template_validator could not even reach their assertions.
# Fixing the image converted 34 errors into 15 real failures and 15 passes, which is why the
# failure count went UP while the suite got healthier - worth knowing before reading a rise in
# `failed` as a regression.) Two remaining causes:
#
# (a) Stale schema - fail at COLLECTION:
#       tests/test_pipeline_service.py      AttributeError: module 'models.template' has no attribute 'Job'
#       tests/test_property_based.py        ImportError: cannot import name 'PatternType'
#       tests/test_template_catalog.py      ImportError: cannot import name 'PatternType'
#       tests/test_template_job_service.py  AttributeError: module 'template' has no attribute 'Job'
#     src/models/template.py once defined PatternType, TemplateType, Job, Framework,
#     DeploymentPattern, ParameterType and Parameter (see commit cd0115a6); it now defines
#     only TemplateMetadata, Template and ValidationResult. Production code moved with it -
#     src/services/template_validator.py reads jobs as plain dicts (`job.get('name')`) - so
#     the models went on purpose and these four were left behind testing a schema that is
#     gone. Rewriting them against the current dict-based shape is the fix; they cannot be
#     repaired by an import.
#
# (b) Missing or renamed fixtures - collect, then fail (25 total):
#       tests/test_iac_filtering.py            (5)  FileNotFoundError: Template not found: langraph-agentcore
#       tests/test_iac_filtering_standalone.py (5)  same, plus structural assertions
#       tests/test_bootstrap_engine.py         (10) residual staleness, see below
#       tests/test_template_validator.py       (5)  residual staleness, see below
#     No template named `langraph-agentcore` exists. The nearest real one is
#     `agent-scaffold-langgraph` (note the spelling), so this is a rename these tests never
#     followed.
#
# One cause was NOT stale and has been FIXED rather than documented. test_bootstrap_engine.py
# and test_template_validator.py used to contribute 34 collection errors, all of them
# `FileNotFoundError: Schema file not found: /app/schemas/template_metadata_schema.json`,
# because backend/Dockerfile never COPYed backend/schemas/. They failed only inside the
# container and passed on a host checkout, which is exactly how it stayed invisible - and the
# same omission broke TemplateValidator at RUNTIME in the deployed image, taking out
# bootstrap.py:47 and TemplateCatalog.validate_template(). See the comment on that COPY line.
# With the schema present those two modules now reach their assertions: 15 pass, 15 fail. The
# 15 that fail are genuine residual staleness in the same vein as (a) and (b).
#
# Listing all of these in `addopts = --ignore=...` was the obvious move and is the wrong one.
# A suppressed module reports as a green suite, which is the same failure mode this whole
# branch has been fixing: a reassuring answer where no measurement happened. It is also how
# the Dockerfile bug above hid - it was inside the ignore list, so nobody read the error.
# `pytest` exits non-zero until these are rewritten or deleted; the README documents the
# explicit --ignore list for when a green subset is needed as a gate, and that at least
# names what it skipped.

# Collection order is randomized by pytest-randomly, which has caught real inter-test state
# leaks here. Keep it on; pass -p no:randomly only to reproduce a specific failing order.
filterwarnings =
    # SQLAlchemy 2.0 and Pydantic V2 deprecations from dependencies and from src/, ~27 per
    # run. Downgraded to keep real warnings legible, NOT silenced - they still print.
    default::DeprecationWarning
