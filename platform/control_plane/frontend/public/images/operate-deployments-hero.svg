<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Deployments — pipeline runs streaming to production">
  <defs>
    <linearGradient id="opd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="opd-belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.1"/>
      <stop offset="0.4" stop-color="#a7f3d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="opd-card-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="opd-card-run" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#opd-bg)"/>
  <!-- horizon glow -->
  <ellipse cx="320" cy="220" rx="360" ry="60" fill="#a7f3d0" fill-opacity="0.10"/>

  <!-- pipeline belt -->
  <rect x="40" y="110" width="560" height="34" rx="17" fill="url(#opd-belt)"/>
  <g stroke="#ecfeff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round">
    <line x1="70"  y1="127" x2="90"  y2="127"/>
    <line x1="105" y1="127" x2="125" y2="127"/>
    <line x1="140" y1="127" x2="160" y2="127"/>
    <line x1="175" y1="127" x2="195" y2="127"/>
    <line x1="500" y1="127" x2="520" y2="127"/>
    <line x1="535" y1="127" x2="555" y2="127"/>
    <line x1="570" y1="127" x2="590" y2="127"/>
  </g>

  <!-- build cards moving along the belt -->
  <g>
    <rect x="70"  y="72" width="90" height="60" rx="12" fill="url(#opd-card-ok)" stroke="#a7f3d0" stroke-opacity="0.9"/>
    <text x="82" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" font-weight="700" fill="#065f46">Build #142</text>
    <text x="82" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#047857">✓ Deployed</text>

    <rect x="185" y="72" width="90" height="60" rx="12" fill="url(#opd-card-run)" stroke="#fde68a"/>
    <text x="197" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" font-weight="700" fill="#92400e">Build #143</text>
    <text x="197" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#b45309">⟳ Deploying…</text>

    <rect x="300" y="72" width="90" height="60" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0"/>
    <text x="312" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" font-weight="700" fill="#1e293b">Build #144</text>
    <text x="312" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#475569">Queued</text>
  </g>

  <!-- target: cloud stack (production) -->
  <g transform="translate(470,54)">
    <rect x="0"  y="14" width="118" height="20" rx="6" fill="#ecfeff" fill-opacity="0.85"/>
    <rect x="8"  y="40" width="102" height="20" rx="6" fill="#ecfeff" fill-opacity="0.65"/>
    <rect x="16" y="66" width="86"  height="20" rx="6" fill="#ecfeff" fill-opacity="0.45"/>
    <text x="59" y="28" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="11" font-weight="700" fill="#0e7490">PROD</text>
  </g>
  <path d="M405 100 L455 90" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- streaming log ticks -->
  <g fill="#a7f3d0" fill-opacity="0.9">
    <circle cx="60"  cy="190" r="2.4"/>
    <circle cx="90"  cy="190" r="2.4"/>
    <circle cx="120" cy="190" r="2.4"/>
    <circle cx="150" cy="190" r="2.4"/>
    <circle cx="180" cy="190" r="2.4"/>
    <circle cx="210" cy="190" r="2.4"/>
  </g>
  <line x1="55" y1="205" x2="240" y2="205" stroke="#a7f3d0" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>
