<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Prompt Optimization — variants scored, winner promoted">
  <defs>
    <linearGradient id="opo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="opo-winner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="opo-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#opo-bg)"/>
  <ellipse cx="500" cy="60" rx="220" ry="90" fill="#fbbf24" fill-opacity="0.12"/>

  <!-- Seed prompt (left) -->
  <g transform="translate(30,84)">
    <rect width="130" height="72" rx="14" fill="url(#opo-card)" stroke="#c7d2fe"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" font-weight="800" fill="#4338ca" letter-spacing="1">SEED PROMPT</text>
    <line x1="14" y1="36" x2="116" y2="36" stroke="#c7d2fe"/>
    <line x1="14" y1="46" x2="106" y2="46" stroke="#c7d2fe"/>
    <line x1="14" y1="56" x2="86"  y2="56" stroke="#c7d2fe"/>
  </g>

  <!-- Arrow to variants -->
  <path d="M162 120 L206 100" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M162 120 L206 120" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M162 120 L206 140" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Variants column (3 cards) -->
  <g transform="translate(210,54)">
    <!-- v1 -->
    <rect x="0" y="0" width="150" height="42" rx="10" fill="url(#opo-card)" stroke="#c7d2fe"/>
    <text x="12" y="16" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" font-weight="700" fill="#4338ca">Variant A</text>
    <text x="12" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#475569">score 3.6 / 5</text>
    <circle cx="132" cy="21" r="7" fill="#e2e8f0"/>
    <!-- v2 (winner glow) -->
    <rect x="0" y="52" width="150" height="42" rx="10" fill="url(#opo-winner)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" font-weight="700" fill="#92400e">Variant B</text>
    <text x="12" y="83" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#78350f">score 4.6 / 5 · winner</text>
    <circle cx="132" cy="73" r="7" fill="#fbbf24"/>
    <path d="M129 73 l2 2 l4 -4" stroke="#78350f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- v3 -->
    <rect x="0" y="104" width="150" height="42" rx="10" fill="url(#opo-card)" stroke="#c7d2fe"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" font-weight="700" fill="#4338ca">Variant C</text>
    <text x="12" y="135" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#475569">score 3.9 / 5</text>
    <circle cx="132" cy="125" r="7" fill="#e2e8f0"/>
  </g>

  <!-- Arrow into trophy -->
  <path d="M366 128 L436 122" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <polygon points="436,116 436,128 448,122" fill="#fbbf24"/>

  <!-- Trophy / promote to harness -->
  <g transform="translate(452,60)">
    <rect x="0" y="30" width="140" height="90" rx="16" fill="#0e7490" fill-opacity="0.35" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="70" y="52" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" font-weight="800" fill="#ccfbf1" letter-spacing="1">PROMOTED</text>
    <!-- trophy -->
    <g transform="translate(52,60)">
      <path d="M6 4 h24 v10 a12 12 0 0 1 -24 0 z" fill="#fbbf24" stroke="#b45309"/>
      <path d="M0 6 h6 v4 a4 4 0 0 1 -4 4 z" fill="#f59e0b" stroke="#b45309"/>
      <path d="M36 6 h-6 v4 a4 4 0 0 0 4 4 z" fill="#f59e0b" stroke="#b45309"/>
      <rect x="14" y="26" width="8" height="8" fill="#fbbf24" stroke="#b45309"/>
      <rect x="8" y="34" width="20" height="4" rx="1" fill="#fbbf24" stroke="#b45309"/>
    </g>
    <text x="70" y="110" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="10" fill="#ccfbf1">→ Harness</text>
  </g>
</svg>
