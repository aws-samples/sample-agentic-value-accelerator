<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="LLM Gateway hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="55%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg)"/>

  <!-- Soft glow behind the gateway -->
  <circle cx="400" cy="160" r="170" fill="url(#glow)"/>

  <!-- Faint dot grid -->
  <g fill="#fda4af" opacity="0.18">
    <circle cx="60"  cy="60"  r="1.6"/>
    <circle cx="60"  cy="160" r="1.6"/>
    <circle cx="60"  cy="260" r="1.6"/>
    <circle cx="140" cy="40"  r="1.6"/>
    <circle cx="140" cy="120" r="1.6"/>
    <circle cx="140" cy="220" r="1.6"/>
    <circle cx="140" cy="300" r="1.6"/>
    <circle cx="220" cy="80"  r="1.6"/>
    <circle cx="220" cy="180" r="1.6"/>
    <circle cx="220" cy="280" r="1.6"/>
    <circle cx="660" cy="40"  r="1.6"/>
    <circle cx="660" cy="120" r="1.6"/>
    <circle cx="660" cy="220" r="1.6"/>
    <circle cx="660" cy="300" r="1.6"/>
    <circle cx="740" cy="80"  r="1.6"/>
    <circle cx="740" cy="180" r="1.6"/>
    <circle cx="740" cy="280" r="1.6"/>
  </g>

  <!-- Incoming request lanes converging into the gateway -->
  <g fill="none" stroke-linecap="round">
    <!-- Lane 1 -->
    <path d="M 30 70  Q 200 100 360 150" stroke="#fb7185" stroke-width="3" opacity="0.7"/>
    <!-- Lane 2 -->
    <path d="M 30 160 Q 200 160 360 160" stroke="#f43f5e" stroke-width="3" opacity="0.85"/>
    <!-- Lane 3 -->
    <path d="M 30 250 Q 200 220 360 170" stroke="#fb7185" stroke-width="3" opacity="0.7"/>
    <!-- Lane 4 (high) -->
    <path d="M 30 110 Q 220 130 360 155" stroke="#fda4af" stroke-width="2.5" opacity="0.55"/>
    <!-- Lane 5 (low) -->
    <path d="M 30 220 Q 220 200 360 165" stroke="#fda4af" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- Outgoing lane after gateway -->
  <g fill="none" stroke-linecap="round">
    <path d="M 460 160 Q 600 160 770 160" stroke="#9f1239" stroke-width="3.5" opacity="0.9"/>
    <path d="M 460 160 Q 600 160 770 160" stroke="#fff" stroke-width="1" stroke-dasharray="3 6" opacity="0.7"/>
  </g>

  <!-- Source app chips on the left -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">
    <g>
      <rect x="14" y="54" width="92" height="32" rx="16" fill="url(#card)" stroke="#fecdd3"/>
      <circle cx="34" cy="70" r="5" fill="#f43f5e"/>
      <text x="48" y="74" font-size="12" fill="#9f1239">Agent A</text>
    </g>
    <g>
      <rect x="14" y="144" width="92" height="32" rx="16" fill="url(#card)" stroke="#fecdd3"/>
      <circle cx="34" cy="160" r="5" fill="#fb7185"/>
      <text x="48" y="164" font-size="12" fill="#9f1239">Agent B</text>
    </g>
    <g>
      <rect x="14" y="234" width="92" height="32" rx="16" fill="url(#card)" stroke="#fecdd3"/>
      <circle cx="34" cy="250" r="5" fill="#fda4af"/>
      <text x="48" y="254" font-size="12" fill="#9f1239">Agent C</text>
    </g>
  </g>

  <!-- Bedrock target on the right -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">
    <rect x="664" y="138" width="118" height="44" rx="10" fill="#0f172a"/>
    <text x="723" y="166" font-size="13" fill="#fbbf24" text-anchor="middle">Bedrock</text>
  </g>

  <!-- Central Gateway: funnel + meter -->
  <g transform="translate(360 100)">
    <!-- shadow -->
    <rect x="6" y="10" width="100" height="120" rx="22" fill="#9f1239" opacity="0.18" filter="url(#soft)"/>
    <!-- body -->
    <rect x="0" y="4" width="100" height="120" rx="22" fill="url(#rose)"/>
    <!-- inner panel -->
    <rect x="10" y="14" width="80" height="100" rx="16" fill="#fff" opacity="0.94"/>

    <!-- Funnel glyph (matches the icon metaphor) -->
    <g transform="translate(50 36)" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -22 -10 L 22 -10 L 8 8 L 8 22 L -8 16 L -8 8 Z"/>
    </g>

    <!-- Meter / token gauge bar -->
    <g transform="translate(20 80)">
      <rect x="0" y="0" width="60" height="6" rx="3" fill="#fecdd3"/>
      <rect x="0" y="0" width="42" height="6" rx="3" fill="url(#rose)"/>
      <circle cx="42" cy="3" r="4" fill="#fff" stroke="#9f1239" stroke-width="1.5"/>
    </g>

    <!-- Tiny label dots = virtual keys / policies -->
    <g transform="translate(20 96)">
      <circle cx="0" cy="0" r="3" fill="#fb7185"/>
      <circle cx="10" cy="0" r="3" fill="#f59e0b"/>
      <circle cx="20" cy="0" r="3" fill="#e11d48"/>
      <text x="30" y="3" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#9f1239">vKeys</text>
    </g>

    <!-- Caption -->
    <text x="50" y="138" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">Gateway</text>
  </g>

  <!-- Floating audit ticks (suggest immutable log) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#9f1239" opacity="0.7">
    <text x="500" y="64">200  •  256 tok</text>
    <text x="500" y="80">200  •  812 tok</text>
    <text x="500" y="96">429  •  rate-limited</text>
    <text x="500" y="252">200  •  guardrail OK</text>
    <text x="500" y="268">budget 73 %</text>
  </g>
</svg>
