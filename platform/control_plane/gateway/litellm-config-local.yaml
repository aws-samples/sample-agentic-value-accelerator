# LiteLLM Gateway Config — Local Development
# Used by docker-compose.yaml for local deployments.
# Environment variables are resolved by LiteLLM at startup.
#
# Each model has two entries:
#   1. Display alias (used by UI / playground)
#   2. Raw Bedrock model ID alias (used by agent foundations via gateway_model_id())

model_list:
# --- Claude Opus 4.8 ---
- model_name: Claude Opus 4.8
  litellm_params:
    model: bedrock/us.anthropic.claude-opus-4-8
    aws_region_name: us-east-2
  model_info:
    mode: chat
    input_cost_per_token: 1.5e-05
    output_cost_per_token: 7.5e-05
    max_input_tokens: 200000
    max_output_tokens: 32000
